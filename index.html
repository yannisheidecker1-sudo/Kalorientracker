<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f9d6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#f6f7f5;--card:#ffffff;--ink:#1b1f1d;--mute:#6b736f;--line:#e3e6e2;
  --acc:#1f9d6b;--acc-soft:#e3f5ed;--warn:#d9822b;--warn-soft:#fbeedd;--bad:#c9473d;
  --p:#3b82c4;--c:#e0a526;--f:#c75b7a;--blue-soft:#e6f0fa;
  --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121513;--card:#1b1f1d;--ink:#eef1ef;--mute:#98a29d;--line:#2a302d;
  --acc:#35c58d;--acc-soft:#17352a;--warn:#f0a050;--warn-soft:#3a2b17;--bad:#ee7066;
  --p:#6aa8e6;--c:#f0c14d;--f:#e987a3;--blue-soft:#1b2a3a;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:12px 14px 96px}
h1,h2,h3{margin:0;font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.top .date{font-size:17px;font-weight:600;text-align:center;flex:1}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:13px;color:var(--mute);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.hero{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:30px;font-weight:700;line-height:1}
.ring .sub{font-size:12px;color:var(--mute);margin-top:4px}
.stats{flex:1;display:grid;gap:8px}
.stat{display:flex;justify-content:space-between;font-size:14px}
.stat b{font-weight:600}
.stat span{color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.mrow{margin:10px 0}
.mrow .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.mrow .l span{color:var(--mute)}
.meal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.meal .mh h2{font-size:16px}
.meal .mh .k{color:var(--mute);font-size:14px;margin-left:8px;font-weight:400}
.mh .acts{display:flex;gap:6px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.pill.acc{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.pill.sel{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.entry{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.entry .n{min-width:0}
.entry .n div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .m{font-size:12px;color:var(--mute)}
.entry .kc{font-weight:600;white-space:nowrap}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs .in{display:flex;max-width:560px;width:100%;gap:2px}
.tab{flex:1;border:0;background:none;padding:6px 1px;color:var(--mute);font-size:10.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--acc);font-weight:600}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:6}
.water{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--bg);border-radius:10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.btn{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;width:100%}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn[disabled]{opacity:.5}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet .sh h2{font-size:18px}
.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.acts3 button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:12px}
.acts3 button .e{font-size:20px}
.res{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.res .t{min-width:0}
.res .t div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .m{font-size:12px;color:var(--mute)}
.sec-h{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 2px}
.supg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.supb{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px;cursor:pointer;font:inherit}.supb .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;font-weight:700}.supb.on{border-color:var(--acc);background:var(--acc-soft,rgba(31,157,107,.12))}.supb.on .ck{background:var(--acc);border-color:var(--acc)}.supb b{display:block;font-size:14px}.supb i{display:block;font-style:normal;font-size:11px;opacity:.7;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.prev{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:12px 0}
.prev div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px}
.prev b{display:block;font-size:17px}
.prev span{font-size:11px;color:var(--mute)}
.note{font-size:12px;color:var(--mute);margin:6px 0}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.info{background:var(--blue-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
svg text{fill:var(--mute);font-size:10px}
.chart .gl{stroke:var(--line)}
#wtchart svg{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.chart .ln{stroke:#2f7df6;fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pj{stroke:#1e9e5a;fill:none;stroke-width:2.5;stroke-dasharray:6 5;opacity:1}
.chart .raw{fill:#2f7df6;opacity:.9}
.chart .ln{stroke-width:3}
.chart .gt{stroke:var(--warn);stroke-dasharray:3 4;stroke-width:1.5}
.chart circle{fill:var(--acc)}
.chart .raw{fill:#2f7df6}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--mute)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--acc);color:var(--ink);padding:10px 16px;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.25);font-weight:600;animation:tin .35s ease;max-width:92%;text-align:center}
.toast.out{opacity:0;transform:translateY(-8px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@media (max-width:360px){.tab{font-size:10px}}
details summary{cursor:pointer;color:var(--mute);font-size:13px;margin:8px 0}
</style>
</head>

  Object.keys(R.days||{}).forEach(d=>{
    const a=L.days[d],b=R.days[d],rt=(R.dt&&R.dt[d])||0,lt=(L.dt&&L.dt[d])||0;
    let take=false;
    if(!a)take=true;

    else if(!dayEmpty(a)&&dayEmpty(b))take=false;
    else if(rt>lt)take=true;
    if(take){M.days[d]=JSON.parse(JSON.stringify(b));M.dh[d]=hsh(JSON.stringify(b));M.dt[d]=rt}
  });
  if(((R.pt||0)>(L.pt||0))&&R.profile){M.profile=Object.assign(defState().profile,R.profile);M.ph=hsh(JSON.stringify(M.profile));M.pt=R.pt}
  const wm={};(R.weights||[]).forEach(w=>wm[w.d]=w);
  const rNewer=(R.pt||0)>(L.pt||0);
  (L.weights||[]).forEach(w=>{if(!wm[w.d]||!rNewer)wm[w.d]=w});
  M.weights=Object.values(wm).sort((a,b)=>a.d<b.d?-1:1);
  const uni=(a,b)=>{const ids=new Set((a||[]).map(x=>x.id));return (a||[]).concat((b||[]).filter(x=>!ids.has(x.id)))};
  M.foods=uni(L.foods,R.foods);M.recipes=uni(L.recipes,R.recipes);M.recent=uni(L.recent,R.recent).slice(0,30);

}

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function trendSeries(){
  const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1),out=[];let tr=null,pt=null;
  ws.forEach(w=>{
    const t=new Date(w.d+'T12:00').getTime();
    if(tr==null)tr=w.kg;else{const dt=Math.max(1,Math.round((t-pt)/864e5));tr=tr+(1-Math.pow(0.85,dt))*(w.kg-tr)}
    pt=t;out.push({d:w.d,t,kg:w.kg,tr});
  });
  return out;
}
function trendRate(){
  const ts=trendSeries();if(ts.length<3)return null;
  const last=ts[ts.length-1];
  const a=ts.find(x=>x.t>=last.t-14*864e5)||ts[0];
  const span=Math.round((last.t-a.t)/864e5);
  if(span<10)return null;
  return{rate:(a.tr-last.tr)/(span/7),span};
}
function measuredTdee(){
  const ts=trendSeries();if(ts.length<2)return null;
  const last=ts[ts.length-1];
  const a=ts.find(x=>x.t>=last.t-28*864e5)||ts[0];
  const span=Math.round((last.t-a.t)/864e5);
  if(span<14)return null;
  let sum=0,n=0,d=a.d;
  while(d<=last.d){
    if(d!==TODAY&&S.days[d]){const k=sumN(S.days[d].e).k;if(k>=800){sum+=k;n++}}
    d=shift(d,1);
  }
  if(n<10||n<span*0.6)return null;
  const dKg=last.tr-a.tr,t=sum/n-dKg*7700/span;
  if(t<1200||t>5500)return null;
  return{tdee:t,avg:sum/n,span,n,dKg};
}
function effRate(){const p=S.profile;if(p.manualKcal>0){const pl=plan();return Math.max(0,(pl.tdee-pl.target)*7/7700)}return p.rate}
function suggestion(){
  const m=measuredTdee();if(!m)return null;

}

function mondayOf(d){const wd=(new Date(d+'T12:00').getDay()+6)%7;return shift(d,-wd)}
function tgFor(d,pl){const dd=S.days[d];return (d!==TODAY&&dd&&dd.tg)?dd.tg:pl.target}
function pgFor(d,pl){const dd=S.days[d];return (d!==TODAY&&dd&&dd.pg)?dd.pg:pl.prot}
function snapTargets(){const dd=S.days[cur];if(dd&&dd.e&&dd.e.length){const pl=plan();dd.tg=pl.target;dd.pg=pl.prot}}
function dayStats(d,pl){
  const dd=S.days[d],t=dd?sumN(dd.e):zero(),tg=tgFor(d,pl),pg=pgFor(d,pl);
  const kr=tg?t.k/tg:0,pr=pg?t.p/pg:0,eat=t.k>=800;
  let ks=0;
  if(eat){if(kr>=0.95&&kr<=1.05)ks=3;else if((kr>=0.90&&kr<0.95)||(kr>1.05&&kr<=1.10))ks=2;else if((kr>=0.85&&kr<0.90)||(kr>1.10&&kr<=1.15))ks=1}

  return{t,tg,pg,ks,ps,kOk:stars>=1,pOk:ps===2,stars};
}
function runs(pl){
  const keys=Object.keys(S.days).filter(d=>d<=TODAY&&S.days[d].e&&S.days[d].e.length&&dayStats(d,pl).kOk).sort();
  let best=0,run=0,prev=null;
  keys.forEach(k=>{run=(prev&&shift(prev,1)===k)?run+1:1;best=Math.max(best,run);prev=k});
  const last=keys[keys.length-1];
  return{cur:(last&&(last===TODAY||last===shift(TODAY,-1)))?run:0,best,keys};
}
function rewardCtx(pl){

const WTR={w:['1 Woche',7],m:['1 Monat',30],h:['1 Halbjahr',182],y:['1 Jahr',365]};
let wtRange='m',wtShift=0,wtY=0,wtSpan=10,wtCtx=null;
function wtClamp(v){const D=864e5,days=WTR[wtRange][1];const first=wtCtx?wtCtx.ts[0].t:0,now=new Date(TODAY+'T12:00').getTime();const minShift=first?Math.min(0,(first-now)/D+days*0.7-days*0.5):-days;return Math.max(minShift-days*0.5,Math.min(730,v))}
function chart(ts,p,end){
  const W=340,H=190,L=34,R=10,T=10,B=22;
  const days=WTR[wtRange][1],now=new Date(TODAY+'T12:00').getTime(),D=864e5,ctr=now+wtShift*D;
  const t0=ctr-days*D,t1=ctr+Math.round(days/2)*D;
  const last=ts[ts.length-1],lastT=last.t,lastKg=last.kg;
  const vis=ts.filter(w=>w.t>=t0-D/2&&w.t<=t1);
  const rate=Math.max(0,(lastKg-p.goal)>0&&end.getTime()>lastT?(lastKg-p.goal)/((end.getTime()-lastT)/D):0);
  const pe=Math.min(end.getTime(),t1),hasPj=lastKg>p.goal&&end.getTime()>lastT&&lastT<t1;
  const peKg=hasPj?lastKg-rate*((pe-lastT)/D):lastKg;
  const kgs=vis.map(w=>w.kg).concat([p.goal]);if(hasPj){kgs.push(lastKg,peKg)}
  const lo0=Math.floor(Math.min(...kgs)-1),hi0=Math.ceil(Math.max(...kgs)+1);wtSpan=hi0-lo0;
  const lo=lo0+wtY,hi=hi0+wtY;
  const X=t=>L+(t-t0)/Math.max(1,t1-t0)*(W-L-R),Y=k=>T+(hi-k)/(hi-lo)*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  for(let i=0;i<=4;i++){const k=lo+(hi-lo)*i/4;s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(k)+'" y2="'+Y(k)+'"/><text x="'+(L-4)+'" y="'+(Y(k)+3)+'" text-anchor="end">'+Math.round(k)+'</text>'}
  s+='<line class="gt" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(p.goal)+'" y2="'+Y(p.goal)+'"/>';
  if(now>=t0&&now<=t1)s+='<line x1="'+X(now)+'" x2="'+X(now)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--line)" stroke-dasharray="2 3"/>';
  if(hasPj)s+='<line class="pj" x1="'+X(lastT)+'" y1="'+Y(lastKg)+'" x2="'+X(pe)+'" y2="'+Y(Math.max(peKg,p.goal))+'"/>';
  if(vis.length>1)s+='<polyline class="ln" points="'+vis.map(w=>X(w.t)+','+Y(w.kg)).join(' ')+'"/>';
  vis.forEach(w=>{s+='<circle class="raw" cx="'+X(w.t)+'" cy="'+Y(w.kg)+'" r="3"/>'});
  if(!vis.length)s+='<text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle">Keine Einträge in diesem Zeitraum</text>';
  const f=t=>new Date(t).toLocaleDateString('de-DE',{day:'numeric',month:'short',year:days>200?'2-digit':undefined});
  s+='<text x="'+L+'" y="'+(H-6)+'">'+f(t0)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+f(t1)+'</text></svg>';
  return s;
}

  return '<div class="ovl" data-act="ovl"><div class="sheet"><div class="sh"><h2>'+title+'</h2><button class="iconbtn" data-act="'+(back||'close')+'">'+(back?'‹':'×')+'</button></div>'+body+'</div></div>';
}
function renderSheet(){
  const o=document.getElementById('ovl');
  if(!sheet){o.innerHTML='';return}
  const f={diag:shDiag,add:shAdd,amt:shAmt,scan:shScan,newf:shNew,ai:shAi,quick:shQuick,ent:shEnt,rec:shRec,imp:shImp,exp:shExp}[sheet.t];
  o.innerHTML=f();
  if(sheet.t==='add'){drawResults()}
  if(sheet.t==='scan')startCam();
}

function drawResults(){
  const el=document.getElementById('results');if(!el)return;
  const q=(sheet.q||'').trim().toLowerCase();let h='';
  if(!q){
    if(S.recipes.length){h+='<div class="sec-h">Meine Rezepte</div>'+S.recipes.map(r=>'<div class="res" data-act="prec" data-v="'+r.id+'"><div class="t"><div>★ '+esc(r.name)+'</div><div class="m">'+r.items.length+' Zutaten</div></div><div class="kc"><b>'+r0(sumN(r.items).k)+'</b><div class="m">kcal</div></div></div>').join('')}
    if(S.recent.length)h+='<div class="sec-h">Zuletzt verwendet</div>'+S.recent.map(f=>foodRow(f,'pfood')).join('');
    if(S.foods.length)h+='<div class="sec-h">Meine Lebensmittel</div>'+S.foods.map(f=>foodRow(f,'pfood')).join('');
    h+='<div class="sec-h">Häufige Lebensmittel</div>'+BASE.slice(0,12).map(f=>foodRow(f,'pfood')).join('');
  }else{
    const rs=S.recipes.filter(r=>r.name.toLowerCase().includes(q));
    h+=rs.map(r=>'<div class="res" data-act="prec" data-v="'+r.id+'"><div class="t"><div>★ '+esc(r.name)+'</div><div class="m">Rezept</div></div><div class="kc"><b>'+r0(sumN(r.items).k)+'</b><div class="m">kcal</div></div></div>').join('');

    else if(q.length<3)h+='<div class="note">Tippe weiter für Online-Treffer …</div>';
  }

}

const fold=t=>String(t).toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss');
function stems(t){const a=[t];if(t.length>4&&t.endsWith('en'))a.push(t.slice(0,-2));if(t.length>3&&/[nes]$/.test(t))a.push(t.slice(0,-1));return a}
function localSearch(q){
  const toks=fold(q).split(/\s+/).filter(Boolean);
  const sc=f=>{const n=fold(f.name);if(f.bc&&f.bc===q)return 0;if(!toks.every(t=>stems(t).some(x=>n.includes(x))))return null;return (n.startsWith(toks[0].slice(0,4))?0:1)+(n.split(/[\s(,]+/).some(w=>w.startsWith(toks[0].slice(0,4)))?0:0.5)+(S.foods.includes(f)?-0.3:0)};
  return allFoods().map(f=>({f,s:sc(f)})).filter(x=>x.s!==null).sort((a,b)=>a.s-b.s||a.f.name.length-b.f.name.length).map(x=>x.f);
}

/* ---------- Barcode + KI ---------- */
async function shrink(file,max){
  const bmp=await createImageBitmap(file);
  const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return{bmp,cv,blob:await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85))};
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
const KEYK='kt_apikey',MODELK='kt_aimodel';
function errText(e){if(!e)return 'unbekannter Fehler';if(e.name==='AbortError')return 'Zeitüberschreitung';if(e.name==='TypeError')return 'keine Verbindung oder vom Browser blockiert';return e.message||'Fehler'}
function fetchT(url,ms,init){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||9000);return fetch(url,Object.assign({signal:c.signal},init||{})).finally(()=>clearTimeout(t))}
function norm(c){return String(c||'').replace(/\D/g,'').replace(/^0+/,'')}
function eanOk(c){
  if(!/^\d+$/.test(c)||![8,12,13,14].includes(c.length))return false;
  const d=c.split('').map(Number),chk=d.pop();let sum=0;
  d.reverse().forEach((x,i)=>sum+=x*(i%2===0?3:1));
  return (10-sum%10)%10===chk;
}
let detP=null;
function getDetector(){
  if(detP)return detP;
  detP=(async()=>{
    const fm=['ean_13','ean_8','upc_a','upc_e','code_128'];
    if('BarcodeDetector' in window){
      try{
        const sup=await BarcodeDetector.getSupportedFormats();
        if(sup.includes('ean_13')){const d=new BarcodeDetector({formats:fm.filter(f=>sup.includes(f))});return{kind:'nativ',detect:async src=>(await d.detect(src)).map(x=>x.rawValue)}}
      }catch(e){}
    }
    await loadScript('barcode-detector.js');
    const API=window.BarcodeDetectionAPI;
    API.prepareZXingModule({overrides:{locateFile:(pth,prefix)=>pth.endsWith('.wasm')?'zxing_reader.wasm':prefix+pth},fireImmediately:true});
    const d=new API.BarcodeDetector({formats:fm});
    return{kind:'wasm',detect:async src=>(await d.detect(src)).map(x=>x.rawValue)};
  })();
  detP.catch(()=>{detP=null});
  return detP;
}
function pickCode(list){const cs=(list||[]).map(x=>String(x).replace(/\D/g,''));return cs.find(eanOk)||null}
async function decodeBarcode(file){
  let img;try{img=await shrink(file,1800)}catch(e){return null}
  let det;try{det=await getDetector()}catch(e){return null}
  for(const src of [img.cv,img.bmp]){try{const c=pickCode(await det.detect(src));if(c)return c}catch(e){}}
  return null;
}

function offToFood(p,code){
  const n=p.nutriments||{};
  let pn=p.product_name;if(pn&&typeof pn==='object')pn=pn.de||pn.main||pn.en||Object.values(pn)[0];
  let br=p.brands;if(Array.isArray(br))br=br[0];
  const name=[br?String(br).split(',')[0].trim():'',pn||''].filter(Boolean).join(' ')||('Produkt '+code);
  const g=x=>+n[x]||0;
  let k=n['energy-kcal_100g'];if(k==null&&n['energy_100g']!=null)k=n['energy_100g']/4.184;
  const ml=/\bml\b|\bl\b/i.test(String(p.quantity||'')),u=ml?'ml':'g';
  const na=n['sodium_100g']!=null?g('sodium_100g')*1000:g('salt_100g')/2.5*1000;
  const sv=+p.serving_quantity||0;

async function offSearch(q){

const NUMW={ein:1,eine:1,einen:1,einem:1,einer:1,zwei:2,drei:3,vier:4,fuenf:5,sechs:6,sieben:7,acht:8,neun:9,zehn:10,elf:11,zwoelf:12,halbe:0.5,halben:0.5,halbes:0.5,anderthalb:1.5};
const UNITW={g:'g',gramm:'g',gr:'g',kg:'kg',kilo:'kg',ml:'ml',milliliter:'ml',l:'l',liter:'l',glas:'glas',glaeser:'glas',tasse:'glas',tassen:'glas',becher:'glas',el:'el',essloeffel:'el',tl:'tl',teeloeffel:'tl',loeffel:'el'};
function parseSpoken(txt){
  const parts=String(txt||'').split(/,|;|\n|\bund\b|\bsowie\b|\bplus\b|\bdazu\b|\banschliessend\b|\banschließend\b/i).map(x=>x.trim()).filter(Boolean);
  const out=[];
  parts.forEach(p0=>{
    let p=p0.replace(/\b(ich habe|ich hab|hatte|gegessen|getrunken|zum fr(ü|ue)hst(ü|ue)ck|zum mittagessen|zum abendessen|heute|noch|dann|außerdem|ausserdem|von|vom|der|die|das|dem|den|ca\.?|circa|etwa|ungefähr)\b/gi,' ').replace(/\s+/g,' ').trim();
    if(!p)return;
    let qty=1,unit='',m;
    const toks=p.split(' ');
    let i=0;
    const f0=fold(toks[0]||'');
    if((m=toks[0].match(/^(\d+(?:[.,]\d+)?)(g|gr|kg|ml|l)?$/i))){qty=num(m[1]);if(m[2])unit=UNITW[m[2].toLowerCase()];i=1}
    else if(NUMW[f0]!=null){qty=NUMW[f0];i=1}
    if(i===1&&!unit&&toks[1]){const u=UNITW[fold(toks[1])];if(u){unit=u;i=2}}
    if(toks[i]&&/^(von|vom|aus)$/i.test(toks[i]))i++;
    const name=toks.slice(i).join(' ').trim();
    if(name)out.push({name,qty,unit,raw:p0});
  });
  return out;
}
function matchSpoken(txt){
  const res=[],miss=[];
  parseSpoken(txt).forEach(it=>{
    const best=nm=>{
      let list=localSearch(nm);
      if(!list.length){const w=nm.split(' ');for(let n=w.length-1;n>=1&&!list.length;n--)list=localSearch(w.slice(0,n).join(' '));if(!list.length&&w.length>1)list=localSearch(w[w.length-1])}
      if(!list.length)return null;
      const ALI={eier:'ei',eiern:'ei',spiegeleier:'ei',spiegelei:'ei'};
      let q=fold(nm);const w0=q.split(' ')[0];if(ALI[w0]){list=localSearch(ALI[w0]).concat(list)}
      const qs=stems(w0).concat(ALI[w0]?[ALI[w0]]:[]);
      const exs=list.filter(x=>{const fw=fold(x.name).split(/[\s(,\/]+/)[0];return fold(x.name)===q||qs.includes(fw)});const ex=exs.find(x=>fold(x.name)===q)||exs.filter(x=>!/\bmit\b/i.test(x.name))[0]||exs[0];
      return {f:ex||list[0],exact:!!ex,full:!!list.find(x=>fold(x.name)===q)};
    };
    let bm=best(it.name);
    if(!(bm&&bm.full)&&/\bmit\b/i.test(it.name)){
      const sub=it.name.split(/\bmit\b/i).map(x=>x.trim()).filter(Boolean);
      if(sub.length>1&&sub.every(x=>best(x))){sub.forEach((x,j)=>{const b2=best(x);const srv=b2.f.serv||100;const g=(j===0?it.qty:1)*srv;const n=scale(b2.f,g);res.push({name:b2.f.name,g,k:n.k,p:n.p,c:n.c,f:n.f,fi:n.fi,su:n.su})});return}
    }
    const f=bm&&bm.f;
    if(!f){miss.push(it.name);return}
    const srv=f.serv||(f.u==='ml'?200:100);
    let g;
    if(it.unit==='g'||it.unit==='ml')g=it.qty;
    else if(it.unit==='kg'||it.unit==='l')g=it.qty*1000;
    else if(it.unit==='el')g=it.qty*15;
    else if(it.unit==='tl')g=it.qty*5;
    else if(it.unit==='glas')g=it.qty*(f.u==='ml'?200:srv);
    else g=it.qty*srv;
    const n=scale(f,g);
    res.push({name:f.name,g,k:n.k,p:n.p,c:n.c,f:n.f,fi:n.fi,su:n.su});
  });
  return{items:res,miss};
}

   }catch(e){srec=null;if(msg)msg.textContent='Spracheingabe hier nicht möglich. Tippe stattdessen auf das Mikrofon deiner Tastatur.'}
 },
 sup(el){const k=el.dataset.v,dd=day(cur);dd.sup=dd.sup||{};dd.sup[k]=dd.sup[k]?0:1;save();render()},
 tip(el){const f=findFood(el.dataset.v);if(f)openSheet({t:'amt',food:f,meal:defMeal(),amt:f.serv||100})},
 adapt(){const g=suggestion();if(!g)return;S.profile.tdeeRatio=g.ratio;save();render()},
 adaptoff(){delete S.profile.tdeeRatio;save();render()},
 wkd(el){const n=wkOff+(+el.dataset.v);if(n>=0&&n<=60){wkOff=n;render()}},
 preset(el){const[a,b]=el.dataset.v.split('|').map(Number);S.profile.macroMode='pct';S.profile.protPct=a;S.profile.fatPct=b;save();render()},
 manualclear(){delete S.profile.manualKcal;save();render()},
 gscan(){openSheet({t:'scan',meal:sheet.meal})},
 gai(){openSheet({t:'ai',meal:sheet.meal,text:'',needKey:!HAS_AI&&!aiKey()});const f=document.getElementById('aifileinp');if(f&&!(sheet.needKey))try{f.click()}catch(e){}},
 aiscale(el){const f=+el.dataset.v;sheet.items.forEach(i=>{['g','k','p','c','f','fi','su'].forEach(k=>i[k]=i[k]*f)});document.getElementById('aires').innerHTML=aiResHtml()},
 savekey(){const v=(document.getElementById('apikey').value||'').trim();if(v.length<20)return;try{localStorage.setItem(KEYK,v)}catch(e){}if(sheet&&sheet.t==='ai'){sheet.needKey=false;renderSheet()}else render()},
 delkey(){try{localStorage.removeItem(KEYK)}catch(e){}render()},
 gnew(){openSheet({t:'newf',meal:sheet.meal,draft:{u:'g'}})},
 gquick(){openSheet({t:'quick',meal:sheet.meal})},
 pfood(el){const f=findFood(el.dataset.v);if(f)openSheet({t:'amt',food:f,meal:sheet.meal,amt:f.serv||100})},
 prec(el){openSheet({t:'rec',id:el.dataset.v,meal:sheet.meal})},
 setamt(el){sheet.amt=num(el.dataset.v);const i=document.getElementById('amt');i.value=sheet.amt;document.getElementById('prev').innerHTML=prevHtml(scale(sheet.food,sheet.amt))},
 doadd(){const f=sheet.food,a=sheet.amt;if(a<=0)return;
   if(f.id[0]==='o'&&!S.foods.some(x=>x.id===f.id))S.foods.unshift(f);
   addEntry(sheet.meal,f.name,a,f.u,scale(f,a));remember(f);save();closeSheet()},
 bcgo(){const v=document.getElementById('bcnum').value.replace(/\D/g,'');if(v.length<6){document.getElementById('scanmsg').textContent='Bitte eine gültige Nummer eingeben.';return}gotCode(v)},
 savenew(){
   const d=sheet.draft;if(!(d.name||'').trim()){document.getElementById('newmsg').textContent='Bitte einen Namen eingeben.';return}
   const f={id:'u'+uidn(),name:d.name.trim(),bc:(d.bc||'').replace(/\D/g,'')||null,u:d.u==='ml'?'ml':'g',serv:num(d.serv)||0,sl:''};
   NK.forEach(k=>f[k]=num(d[k]));f.na=num(d.salt)/2.5*1000;
   if(f.serv)f.sl='Portion ('+f.serv+' '+f.u+')';
   S.foods.unshift(f);save();openSheet({t:'amt',food:f,meal:sheet.meal,amt:f.serv||100});
 },
 ailocal(){runLocal()},
 aimic(el){
   const msg=document.getElementById('aimsg'),ta=document.getElementById('aitext'),show=t=>{if(msg){msg.style.display=t?'block':'none';msg.textContent=t||''}};
   if(srec){try{srec.stop()}catch(e){}return}
   if(!SRC){show('Spracheingabe geht hier nicht. Tippe auf das Mikrofon deiner Tastatur und sprich damit.');return}
   try{
     const r=new SRC();srec=r;r.lang='de-DE';r.interimResults=true;r.continuous=false;
     const base=ta.value?ta.value.trim()+' ':'';
     r.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;ta.value=base+t;sheet.text=ta.value};
     r.onend=()=>{srec=null;const b=document.getElementById('aimic');if(b)b.textContent='🎤 Einsprechen';show('');
       const t=(document.getElementById('aitext')||{value:''}).value.trim();if(t&&sheet&&sheet.t==='ai'){sheet.text=t;if(HAS_AI||aiKey())runAi();else runLocal()}};
     r.onerror=e=>{srec=null;const b=document.getElementById('aimic');if(b)b.textContent='🎤 Einsprechen';show('Spracheingabe hier nicht möglich ('+(e.error||'Fehler')+'). Tippe stattdessen auf das Mikrofon deiner Tastatur.')};
     r.start();el.textContent='■ Stopp';show('Ich höre zu …');
   }catch(e){srec=null;show('Spracheingabe hier nicht möglich. Tippe stattdessen auf das Mikrofon deiner Tastatur.')}
 },
 airun(){runAi()},
 aidel(el){sheet.items.splice(+el.dataset.v,1);document.getElementById('aires').innerHTML=aiResHtml()},
 aiadd(){sheet.items.forEach(i=>{const n=zero();n.k=i.k;n.p=i.p;n.c=i.c;n.f=i.f;n.fi=i.fi;n.su=i.su;addEntry(sheet.meal,i.name+' (geschätzt)',i.g,'g',n)});save();closeSheet()},
 doquick(){const n=zero();n.k=num(document.getElementById('qk').value);n.p=num(document.getElementById('qp').value);n.c=num(document.getElementById('qc').value);n.f=num(document.getElementById('qf').value);
   if(n.k<=0&&n.p+n.c+n.f>0)n.k=n.p*4+n.c*4+n.f*9;if(n.k<=0)return;
   addEntry(sheet.meal,(document.getElementById('qn').value||'Schnell eingetragen'),1,'x',n);save();closeSheet()},
 ent(el){openSheet({t:'ent',id:el.dataset.v})},
 entdel(){const dd=day(cur);dd.e=dd.e.filter(x=>x.id!==sheet.id);save();closeSheet()},
 entsave(){const e=day(cur).e.find(x=>x.id===sheet.id);const q=num(document.getElementById('eq').value);if(q<=0||!e.qty)return;
   const f=q/e.qty;NK.forEach(k=>e.n[k]*=f);e.qty=q;save();closeSheet()},
 saverec(el){
   const es=day(cur).e.filter(e=>e.meal===el.dataset.v);if(!es.length)return;
   const nm=(MEALS.find(m=>m[0]===el.dataset.v)||[0,'Mahlzeit'])[1]+' vom '+new Date(cur+'T12:00').toLocaleDateString('de-DE',{day:'numeric',month:'numeric'});
   S.recipes.unshift({id:'r'+uidn(),name:nm,items:es.map(e=>({name:e.name,qty:e.qty,unit:e.unit,n:Object.assign({},e.n)}))});save();
   const b=el;b.textContent='✓ Gespeichert';b.disabled=true;
 },
 reclog(){const r=S.recipes.find(x=>x.id===sheet.id);r.items.forEach(i=>addEntry(sheet.meal,i.name,i.qty,i.unit,Object.assign({},i.n)));save();closeSheet()},
 recdel(){S.recipes=S.recipes.filter(x=>x.id!==sheet.id);save();openSheet({t:'add',meal:sheet.meal,q:''})},
 addw(){const d=parseDe(document.getElementById('wd').value),k=num(document.getElementById('wk').value);
   if(!d||d>TODAY){toast('Bitte ein gültiges Datum eingeben, z. B. '+deDate(TODAY));return}
   if(k<30||k>300){toast('Bitte ein gültiges Gewicht eingeben');return}
   S.weights=S.weights.filter(w=>w.d!==d);S.weights.push({d,kg:k});save();render()},
 delw(el){if(S.weights.length<=1)return;S.weights=S.weights.filter(w=>w.d!==el.dataset.v);save();render()},
 export(){openSheet({t:'exp'})},
 dlfile(){
   try{const j=JSON.stringify(S);const b=new Blob([j],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='kalorientracker-backup-'+TODAY+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
     S.lastExport=Date.now();save();document.getElementById('expmsg').textContent='Backup-Datei erstellt. Prüfe deine Downloads oder den Teilen-Dialog. Falls nichts passiert (z. B. in der Claude-Vorschau), nimm „Als Text kopieren“.'}
   catch(e){document.getElementById('expmsg').textContent='Datei-Download hier nicht möglich. Nimm „Als Text kopieren“.'}
 },
 async cpjson(){
   const j=JSON.stringify(S);let ok=false;try{await navigator.clipboard.writeText(j);ok=true}catch(e){}
   if(!ok){const d=document.querySelector('details');if(d)d.open=true;const t=document.getElementById('exp');if(t){t.select()}}
   S.lastExport=Date.now();save();document.getElementById('expmsg').textContent=ok?'In die Zwischenablage kopiert. Füge es in eine Notiz oder Datei ein und bewahre es auf.':'Text ist markiert, bitte manuell kopieren.';
 },
 diag(){openSheet({t:'diag'});runDiag()},
 torch(el){try{const on=!el.dataset.on;camTrack.applyConstraints({advanced:[{torch:on}]});el.dataset.on=on?'1':''}catch(e){}},
 restorebak(el){if(!el.dataset.c){el.dataset.c=1;el.textContent='Sicherung wirklich einspielen? Nochmal tippen.';return}
   try{const b=localStorage.getItem(BAK);if(b&&adopt(b)){save();render()}}catch(e){}},
 import(){openSheet({t:'imp'})},
 doimp(){try{const t=document.getElementById('imp').value;if(!adopt(t))throw 0;save();closeSheet()}catch(e){document.getElementById('impmsg').textContent='Das sind keine gültigen Daten.'}},
 reset(el){if(el.dataset.c){S=defState();save();render();return}el.dataset.c=1;el.textContent='Wirklich alles löschen? Nochmal tippen.'}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=A[el.dataset.act];if(f){if(el.tagName==='LABEL')return;f(el,e)}
});
const PBIND={age:'age',h:'h',goal:'goal',rate:'rate',prot:'prot',protPct:'protPct',fatPct:'fatPct'};
document.addEventListener('input',e=>{
  const el=e.target,b=el.dataset&&el.dataset.bind;if(!b)return;
  if(b==='q'){sheet.q=el.value;drawResults();clearTimeout(sheet.onlT);if(el.value.trim().length>=3)sheet.onlT=setTimeout(()=>{if(sheet&&sheet.t==='add')A.onl()},450);return}
  if(b==='zoom'){try{camTrack&&camTrack.applyConstraints({advanced:[{zoom:+el.value}]})}catch(e){}return}
  if(b==='amt'){sheet.amt=num(el.value);document.getElementById('prev').innerHTML=prevHtml(scale(sheet.food,sheet.amt));return}
  if(b==='aitext'){sheet.text=el.value;return}
  if(b==='apikey'||b==='aimodel')return;
  if(b==='sn'){sheet.name=el.value;return}
  if(b==='sk'){sheet.k=num(el.value);return}
  if(b.startsWith('n_')&&sheet&&sheet.draft){sheet.draft[b.slice(2)]=el.value;return}
  if(b==='manual'){const v=num(el.value);S.profile.manualKcal=(v>=800&&v<=8000)?Math.round(v):null;save();return}
  if(PBIND[b]){const v=num(el.value);if(v>0){S.profile[b]=v;save()}}
});
document.addEventListener('change',async e=>{
  const el=e.target,b=el.dataset&&el.dataset.bind;if(!b)return;
  if(b==='sex'){S.profile.sex=el.value;save();render()}
  else if(b==='macroMode'){S.profile.macroMode=el.value;save();render()}
  else if(b==='adapt'){S.profile.adapt=el.value;save();render()}
  else if(b==='act'){S.profile[b]=num(el.value);save();render()}
  else if(PBIND[b]||b==='manual'){render()}
  else if(b==='n_u'){sheet.draft.u=el.value}
  else if(b==='bcfile'&&el.files[0]){
    const m=document.getElementById('scanmsg');m.innerHTML='<span class="spin"></span>Barcode wird gelesen …';
    const code=await decodeBarcode(el.files[0]);
    if(code){m.textContent='Barcode '+code+' erkannt.';gotCode(code)}else m.textContent='Kein Barcode erkannt. Näher ran, mehr Licht, gerade fotografieren, oder die Nummer unten eintippen.';
  }
  else if(b==='labelfile'&&el.files[0]){readLabel(el.files[0])}
  else if(b==='impfile'&&el.files[0]){try{document.getElementById('imp').value=await el.files[0].text();document.getElementById('impmsg').textContent='Datei gelesen. Jetzt „Einspielen“ tippen.'}catch(e){}}
  else if(b==='aifile'&&el.files[0]){sheet.img=el.files[0];const t=document.getElementById('aitext');sheet.text=t?t.value:sheet.text;renderSheet();runAi()}
  else if(b==='aimodel'){try{localStorage.setItem(MODELK,el.value)}catch(e){}}
});

/* ---------- Start ---------- */
load();render();initStorage();
function registerSw(){try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
registerSw();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){flush();return}
  syncNow();
  const t=dkey(new Date());if(t!==TODAY){const wasToday=cur===TODAY;TODAY=t;if(wasToday)cur=TODAY;render()}
});
window.addEventListener('pagehide',flush);
</script>
